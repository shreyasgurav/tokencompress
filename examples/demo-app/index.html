<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tokencompress — live demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --accent:  #6c63ff;
      --accent2: #a78bfa;
      --green:   #34d399;
      --red:     #f87171;
      --yellow:  #fbbf24;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --radius:  10px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    /* HEADER */
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
    header .logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    header .logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: rgba(108,99,255,0.15); color: var(--accent2); border: 1px solid rgba(108,99,255,0.3); }
    .badge-new { background: rgba(52,211,153,0.1); color: var(--green); border-color: rgba(52,211,153,0.25); margin-left: 4px; }

    /* MODE TABS */
    .mode-tabs { display: flex; gap: 2px; background: var(--border); border-radius: 8px; padding: 3px; }
    .mode-tab { padding: 5px 14px; border-radius: 6px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .mode-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .mode-tab .new-pip { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 5px; vertical-align: middle; }

    /* TOOLBAR */
    .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
    .toolbar label { font-size: 13px; color: var(--muted); }
    .toolbar input[type=range] { accent-color: var(--accent); width: 120px; }
    #ratioVal { font-size: 13px; font-weight: 600; color: var(--accent2); min-width: 34px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5a52e8; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .spacer { flex: 1; }
    #detectedType { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.25); display: none; }

    /* PANELS */
    .panels { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 112px); overflow: hidden; }
    .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
    .panel:last-child { border-right: none; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; flex-shrink: 0; }
    .panel-header .tok { font-size: 12px; font-weight: 700; color: var(--text); background: var(--border); padding: 2px 8px; border-radius: 6px; }

    textarea, .output-text { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace; font-size: 13px; line-height: 1.7; padding: 16px; overflow-y: auto; min-height: 0; }
    .output-text { white-space: pre-wrap; word-break: break-word; }
    .output-text.placeholder { color: var(--muted); font-style: italic; font-family: inherit; }

    /* STATS BAR */
    #statsBar { display: none; align-items: center; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border); background: rgba(108,99,255,0.05); font-size: 12px; flex-wrap: wrap; flex-shrink: 0; }
    .stat { display: flex; align-items: center; gap: 5px; }
    .stat .label { color: var(--muted); }
    .stat .val { font-weight: 700; }
    .stat .val.green { color: var(--green); }
    .stat .val.yellow { color: var(--yellow); }
    .stat .val.blue { color: #60a5fa; }

    /* DROPPED PANEL */
    #droppedPanel { border-top: 1px solid var(--border); background: var(--surface); max-height: 160px; overflow-y: auto; display: none; flex-shrink: 0; }
    .panel-sub-header { padding: 8px 16px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
    .dropped-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
    .dropped-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-size: 12px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--text); }
    .dropped-chip .reason { color: var(--red); font-weight: 600; }
    .dropped-chip .count { background: rgba(248,113,113,0.15); padding: 1px 6px; border-radius: 4px; font-size: 11px; color: var(--red); }
    .dropped-chip .sample { color: var(--muted); font-family: monospace; font-size: 11px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* SEGMENT BREAKDOWN */
    #segmentPanel { border-top: 1px solid var(--border); background: var(--surface); max-height: 260px; overflow-y: auto; display: none; flex-shrink: 0; }
    .seg-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
    .seg-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); font-size: 12px; }
    .seg-index { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 22px; text-align: center; background: var(--border); border-radius: 4px; padding: 1px 5px; }
    .seg-tags { display: flex; gap: 4px; flex: 0 0 auto; }
    .seg-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .3px; }
    .tag-json    { background: rgba(59,130,246,0.15);  color: #60a5fa;  border: 1px solid rgba(59,130,246,0.3); }
    .tag-logs    { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .tag-code    { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .tag-diff    { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
    .tag-html    { background: rgba(236,72,153,0.15); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
    .tag-text    { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
    .tag-search  { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
    .tag-fenced  { background: rgba(108,99,255,0.1);  color: var(--accent2); border: 1px solid rgba(108,99,255,0.25); }
    .seg-tokens { color: var(--muted); font-family: monospace; white-space: nowrap; }
    .seg-tokens .before { color: var(--text); }
    .seg-tokens .after  { color: var(--green); }
    .seg-tokens .none   { color: var(--muted); }
    .seg-bar-wrap { flex: 1; min-width: 60px; max-width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .seg-bar { height: 100%; border-radius: 3px; transition: width .3s; }
    .seg-pct { font-size: 11px; font-weight: 700; min-width: 36px; text-align: right; }
    .seg-pct.good { color: var(--green); }
    .seg-pct.none { color: var(--muted); }

    /* SPINNER */
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

<script>
  /* ── refs ── */
  const inputArea    = document.getElementById('inputArea');
  const outputArea   = document.getElementById('outputArea');
  const inputTok     = document.getElementById('inputTok');
  const outputTok    = document.getElementById('outputTok');
  const ratioSlider  = document.getElementById('ratioSlider');
  const ratioVal     = document.getElementById('ratioVal');
  const actionBtn    = document.getElementById('actionBtn');
  const clearBtn     = document.getElementById('clearBtn');
  const sampleChatBtn  = document.getElementById('sampleChatBtn');
  const sampleProseBtn = document.getElementById('sampleProseBtn');
  const detectedType = document.getElementById('detectedType');
  const droppedPanel = document.getElementById('droppedPanel');
  const droppedList  = document.getElementById('droppedList');
  const statsBar     = document.getElementById('statsBar');
  const segmentPanel = document.getElementById('segmentPanel');
  const segmentList  = document.getElementById('segmentList');
  const tabCompress  = document.getElementById('tabCompress');
  const tabSegment   = document.getElementById('tabSegment');
  const tabML        = document.getElementById('tabML');

  let mode = 'compress'; // 'compress' | 'segment' | 'ml'

  /* ── sample Claude-style chat ── */
  const SAMPLE_CHAT = `I've reviewed the codebase and here's what I found. The user service is throwing intermittent auth errors that appear correlated with database load.

Here's the user records payload being processed — all 40 entries share the same shape:

\`\`\`json
${JSON.stringify(Array.from({length:40},(_,i)=>({id:i,username:'user_'+i,role:i<3?'admin':'member',active:true,score:Math.round(Math.random()*100)})),null,2)}
\`\`\`

The application logs from the last deployment show the pattern clearly:

\`\`\`log
[2024-06-08 09:00:01] INFO: Server started on port 3000
[2024-06-08 09:00:02] INFO: Database pool initialised (size=10)
[2024-06-08 09:00:03] INFO: Auth middleware loaded
[2024-06-08 09:00:04] INFO: Cache warmed up — 842 entries
[2024-06-08 09:00:05] INFO: Health check passed
[2024-06-08 09:00:06] INFO: Request received GET /api/users

[2024-06-08 09:00:09] INFO: Request received GET /api/users
[2024-06-08 09:00:10] INFO: Request received GET /api/users
[2024-06-08 09:00:11] INFO: Request received GET /api/users
[2024-06-08 09:00:12] INFO: Request received GET /api/users
[2024-06-08 09:00:13] INFO: Request received GET /api/users
[2024-06-08 09:00:14] INFO: Request received GET /api/users
[2024-06-08 09:00:15] INFO: Request received GET /api/users
[2024-06-08 09:00:16] INFO: Request received GET /api/users
[2024-06-08 09:00:17] INFO: Request received GET /api/users
[2024-06-08 09:00:18] ERROR: JWT verification failed — token expired for uid-2048
[2024-06-08 09:00:19] ERROR: Database connection timeout after 5000ms on pool slot 3
[2024-06-08 09:00:20] INFO: Request received GET /api/users

[2024-06-08 09:00:23] WARN: Response time exceeded 2000ms threshold (2847ms)
[2024-06-08 09:00:24] INFO: Request received GET /api/users
\`\`\`

And here's the authentication handler that needs to be fixed:

\`\`\`typescript
/**
 * Handles incoming authentication requests.
 * Validates the Bearer token and attaches the user to the request context.
 *
 * @param req - Express request object with Authorization header
 * @param res - Express response object
 * @param next - Next middleware function
 * @throws {AuthError} When the token is missing, malformed, or expired
 * @returns void — calls next() on success or sends 401 on failure
 */
function handleAuth(req: Request, res: Response, next: NextFunction): void {
  const header = req.headers.authorization;
  if (!header || !header.startsWith('Bearer ')) {
    res.status(401).json({ error: 'Missing or malformed token' });
    return;
  }
  const token = header.slice(7);
  try {
    const payload = verifyToken(token);
    req.user = payload;
    next();
  } catch (err) {
    res.status(401).json({ error: 'Token invalid or expired' });
  }
}
\`\`\`

The root cause is that token expiry is not being refreshed on active sessions. I'd recommend adding a sliding-window refresh mechanism. Let me know if you want me to implement that.`;

  /* ── 25k-token prose generator ── */
  function generate25kProse() {
    const components = ['authentication', 'billing', 'scheduler', 'ingestion', 'analytics', 'notification', 'storage', 'gateway', 'rendering', 'replication', 'indexing', 'checkout', 'telemetry', 'migration', 'webhook', 'throttling', 'caching', 'federation', 'reconciliation', 'provisioning'];
    const filler = [
      'The team continued to proceed with the usual workflow without anything particularly noteworthy happening during this phase.',
      'Everything moved along quietly and the process kept running smoothly as everyone simply carried on as before.',
      'The routine operations went ahead as usual in a calm and largely uneventful fashion throughout the entire period.',
      'Nothing of particular interest occurred then while the standard procedures were being followed by all participants.',
      'The workflow progressed steadily and everyone remained focused on their assigned tasks without any major disruptions.',
      'Operations continued in the expected manner and the team maintained their regular pace throughout the day.',
      'The process unfolded according to plan and all systems remained stable during this timeframe.',
      'Things proceeded normally and the team kept their attention on the routine maintenance activities.',
    ];
    const paragraphs = [];
    for (let p = 0; p < 80; p++) {
      const sentences = [];
      if (p % 8 === 0 && p < components.length * 3) {
        const c = components[Math.floor(p / 3) % components.length];
        const errCode = 5000 + p * 7;
        sentences.push(`Critical error E${errCode}: the ${c} service failed after ${3 + (p % 5)} retries at ${9 + (p % 12)}:${String((p * 3) % 60).padStart(2, '0')}am so we decided to roll back release ${p + 1}.`);
      }
      for (let s = 0; s < 4 + (p % 3); s++) {
        sentences.push(filler[s % filler.length]);
      }
      if (p % 12 === 5) {
        sentences.push(`The root cause analysis revealed that ${Math.floor(100 + p * 1.3)} requests were queued and ${50 + p} users experienced degraded performance.`);
      }
      paragraphs.push(sentences.join(' '));
    }
    return paragraphs.join('\n\n');
  }

  /* ── mode switching ── */
  function setMode(m, reset = true) {
    mode = m;
    tabCompress.classList.toggle('active', m === 'compress');
    tabSegment.classList.toggle('active',  m === 'segment');
    tabML.classList.toggle('active',       m === 'ml');
    sampleChatBtn.style.display = m === 'segment' ? '' : 'none';
    sampleProseBtn.style.display = m === 'compress' ? '' : 'none';
    detectedType.style.display = 'none';
    inputArea.placeholder = m === 'segment'
      ? 'Paste a Claude / ChatGPT chat here — prose, ```json, ```log, ```typescript, ```diff blocks all handled…'
      : (m === 'ml' ? 'Paste text to compress using the ML Model…' : 'Paste any content — JSON, logs, code, diffs, search results, HTML, or plain text…');
    actionBtn.innerHTML = m === 'segment'
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Segment &amp; Compress'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Compress';
    if (reset) resetOutput();
  }

  tabCompress.addEventListener('click', () => setMode('compress'));
  tabSegment.addEventListener('click',  () => setMode('segment'));
  tabML.addEventListener('click',       () => setMode('ml'));

  /* ── sample loaders ── */
  sampleChatBtn.addEventListener('click', () => {
    inputArea.value = SAMPLE_CHAT;
    updateInputTok();
  });

  sampleProseBtn.addEventListener('click', () => {
    inputArea.value = generate25kProse();
    updateInputTok();
  });

  /* ── utils ── */
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(n) { return Number(n).toLocaleString(); }
  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
  function updateInputTok() {
    const n = Math.round(inputArea.value.length / 4);
    inputTok.textContent = n.toLocaleString() + ' tokens';
  }

  function resetOutput() {
    outputArea.textContent = 'Compressed output will appear here…';
    outputArea.className = 'output-text placeholder';
    outputTok.textContent = '—';
    droppedPanel.style.display = 'none';
    segmentPanel.style.display = 'none';
    statsBar.style.display = 'none';
    detectedType.style.display = 'none';
    document.getElementById('statIterWrap').style.display = 'none';
  }

  /* ── type tag helper ── */
  function typeTag(t) {
    const map = { json:'tag-json', logs:'tag-logs', code:'tag-code', diff:'tag-diff', html:'tag-html', text:'tag-text', search:'tag-search' };
    const cls = map[t] || 'tag-text';
    return `<span class="seg-tag ${cls}">${esc(t)}</span>`;
  }
  function typeBarColor(t) {
    const map = { json:'#3b82f6', logs:'#f59e0b', code:'#34d399', diff:'#fb923c', html:'#f472b6', text:'#6b7280', search:'#a78bfa' };
    return map[t] || '#6b7280';
  }

  /* ── ratio slider ── */
  ratioSlider.addEventListener('input', () => { ratioVal.textContent = ratioSlider.value + '%'; });

  /* ── live token count + detect ── */
  let detectTimer = null;
  inputArea.addEventListener('input', () => {
    updateInputTok();
    if (mode === 'compress') {
      clearTimeout(detectTimer);
      detectTimer = setTimeout(runDetect, 600);
    }
  });

  async function runDetect() {
    const text = inputArea.value.trim();
    if (!text) { detectedType.style.display = 'none'; return; }
    try {
      const r = await fetch('/detect', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}) });
      const d = await r.json();
      if (d.ok) {
        detectedType.textContent = '⬡ ' + d.result.type + (d.result.confidence ? ' · ' + Math.round(d.result.confidence * 100) + '%' : '');
        detectedType.style.display = 'inline';
      }
    } catch {}
  }

  /* ── clear ── */
  clearBtn.addEventListener('click', () => {
    inputArea.value = '';
    inputTok.textContent = '0 tokens';
    resetOutput();
  });

  /* ── main action ── */
  actionBtn.addEventListener('click', async () => {
    const text = inputArea.value.trim();
    if (!text) return;
    const ratio = parseInt(ratioSlider.value) / 100;
    const busyLabel = mode === 'segment' ? 'Segmenting…' : 'Compressing…';
    actionBtn.disabled = true;
    actionBtn.innerHTML = `<div class="spinner"></div> ${busyLabel}`;
    outputArea.textContent = '⏳  Processing ' + text.length.toLocaleString() + ' characters — this may take a moment for large inputs…';
    outputArea.className = 'output-text placeholder';
    outputTok.textContent = '—';
    statsBar.style.display = 'none';
    droppedPanel.style.display = 'none';
    segmentPanel.style.display = 'none';
    try {
      if (mode === 'compress') await runCompress(text, ratio);
      else if (mode === 'segment') await runSegment(text, ratio);
      else                     await runML(text, ratio);
    } finally {
      actionBtn.disabled = false;
      setMode(mode, false); // restore button label without clearing output
    }
  });

  inputArea.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') actionBtn.click();
  });

  /* ── COMPRESS mode ── */
  async function runCompress(text, ratio) {
    try {
      const res  = await fetch('/compress', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, targetRatio:ratio}) });
      const data = await res.json();
      if (!data.ok) { outputArea.textContent = 'Error: ' + data.error; outputArea.className = 'output-text'; return; }
      const r = data.result;
      outputArea.textContent = r.compressed;
      outputArea.className = 'output-text';
      inputTok.textContent = fmt(r.tokensBefore) + ' tokens';
      outputTok.textContent = fmt(r.tokensAfter) + ' tokens';
      document.getElementById('statSaved').textContent = fmt(r.tokensSaved) + ' tokens (' + pct(r.tokensSaved, r.tokensBefore) + '%)';
      document.getElementById('statRatio').textContent = (r.compressionRatio * 100).toFixed(1) + '%';
      document.getElementById('statType').textContent  = r.contentType || '—';
      document.getElementById('statConf').textContent  = r.confidence != null ? Math.round(r.confidence * 100) + '%' : '—';
      document.getElementById('statTypeWrap').style.display = '';
      document.getElementById('statConfWrap').style.display = '';
      document.getElementById('statSegWrap').style.display  = 'none';
      if (r.metrics && r.metrics.passCount) {
        document.getElementById('statIterWrap').style.display = '';
        document.getElementById('statIter').textContent = r.metrics.passCount;
      } else {
        document.getElementById('statIterWrap').style.display = 'none';
      }
      statsBar.style.display = 'flex';
      segmentPanel.style.display = 'none';
      renderDropped(r.dropped);
    } catch (e) { outputArea.textContent = 'Fetch error: ' + e.message; outputArea.className = 'output-text'; }
  }

  /* ── SEGMENT mode ── */
  async function runSegment(text, ratio) {
    try {
      const res  = await fetch('/segment', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, targetRatio:ratio}) });
      const data = await res.json();
      if (!data.ok) { outputArea.textContent = 'Error: ' + data.error; outputArea.className = 'output-text'; return; }
      const r = data.result;
      outputArea.textContent = r.compressed;
      outputArea.className = 'output-text';
      inputTok.textContent = fmt(r.tokensBefore) + ' tokens';
      outputTok.textContent = fmt(r.tokensAfter) + ' tokens';
      document.getElementById('statSaved').textContent = fmt(r.tokensSaved) + ' tokens (' + pct(r.tokensSaved, r.tokensBefore) + '%)';
      document.getElementById('statRatio').textContent = (r.compressionRatio * 100).toFixed(1) + '%';
      document.getElementById('statTypeWrap').style.display = 'none';
      document.getElementById('statConfWrap').style.display = 'none';
      document.getElementById('statSegWrap').style.display  = '';
      document.getElementById('statSeg').textContent = r.segments.length + ' blocks';
      statsBar.style.display = 'flex';
      renderDropped(r.dropped);
      renderSegments(r.segments);
    } catch (e) { outputArea.textContent = 'Fetch error: ' + e.message; outputArea.className = 'output-text'; }
  }

  /* ── ML mode ── */
  async function runML(text, ratio) {
    try {
      const res  = await fetch('/compress-ml', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, targetRatio:ratio}) });
      const data = await res.json();
      if (!data.ok) { outputArea.textContent = 'Error: ' + data.error; outputArea.className = 'output-text'; return; }
      const r = data.result;
      outputArea.textContent = r.compressed;
      outputArea.className = 'output-text';
      inputTok.textContent = fmt(r.tokensBefore) + ' tokens';
      outputTok.textContent = fmt(r.tokensAfter) + ' tokens';
      document.getElementById('statSaved').textContent = fmt(r.tokensSaved) + ' tokens (' + pct(r.tokensSaved, r.tokensBefore) + '%)';
      document.getElementById('statRatio').textContent = (r.compressionRatio * 100).toFixed(1) + '%';
      document.getElementById('statType').textContent  = r.contentType || 'ML Model';
      document.getElementById('statConf').textContent  = '—';
      document.getElementById('statTypeWrap').style.display = '';
      document.getElementById('statConfWrap').style.display = 'none';
      document.getElementById('statSegWrap').style.display  = 'none';
      document.getElementById('statIterWrap').style.display = 'none';
      statsBar.style.display = 'flex';
      renderDropped([]);
    } catch (e) { outputArea.textContent = 'Fetch error: ' + e.message; outputArea.className = 'output-text'; }
  }

  /* ── render dropped chips ── */
  function renderDropped(dropped) {
    if (dropped && dropped.length > 0) {
      droppedList.innerHTML = dropped.map(d =>
        `<div class="dropped-chip">
          <span class="reason">${esc(d.reason)}</span>
          <span class="count">−${fmt(d.count)}</span>
          ${d.sample ? `<span class="sample">${esc(d.sample)}</span>` : ''}
        </div>`
      ).join('');
      droppedPanel.style.display = 'block';
    } else {
      droppedPanel.style.display = 'none';
    }
  }

  /* ── render segment breakdown ── */
  function renderSegments(segments) {
    segmentPanel.style.display = 'block';
    segmentList.innerHTML = segments.map(s => {
      const saved  = s.tokensBefore - s.tokensAfter;
      const ratio  = s.tokensBefore > 0 ? pct(saved, s.tokensBefore) : 0;
      const kept   = s.tokensBefore > 0 ? (s.tokensAfter / s.tokensBefore) * 100 : 100;
      const color  = typeBarColor(s.type);
      const noSave = ratio === 0;
      const kindTag = s.kind === 'fenced'
        ? `<span class="seg-tag tag-fenced">\`\`\`${esc(s.fenceLanguage || '')}</span>`
        : `<span class="seg-tag tag-text">${esc(s.kind)}</span>`;
      const tokLabel = noSave
        ? `<span class="none">${fmt(s.tokensBefore)} tok</span>`
        : `<span class="before">${fmt(s.tokensBefore)}</span><span style="color:var(--muted)"> → </span><span class="after">${fmt(s.tokensAfter)}</span>`;
      return `<div class="seg-row">
        <span class="seg-index">${s.index}</span>
        <div class="seg-tags">${kindTag}${typeTag(s.type)}</div>
        <div class="seg-tokens">${tokLabel}</div>
        <div class="seg-bar-wrap"><div class="seg-bar" style="width:${kept.toFixed(1)}%;background:${noSave ? 'var(--border)' : color}"></div></div>
        <span class="seg-pct ${noSave ? 'none' : 'good'}">${noSave ? '—' : '-' + ratio + '%'}</span>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
